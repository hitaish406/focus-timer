<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>
  <!-- Clock circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="16"/>
  <!-- Minute markers (every 5 minutes = every 30 degrees) -->
  <line x1="256" y1="100" x2="256" y2="116" stroke="#ffffff" stroke-width="8" transform="rotate(0 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(30 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(60 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="116" stroke="#ffffff" stroke-width="8" transform="rotate(90 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(120 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(150 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="116" stroke="#ffffff" stroke-width="8" transform="rotate(180 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(210 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(240 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="116" stroke="#ffffff" stroke-width="8" transform="rotate(270 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(300 256 256)"/>
  <line x1="256" y1="100" x2="256" y2="112" stroke="#ffffff" stroke-width="5" transform="rotate(330 256 256)"/>
  <!-- Hour hand pointing to 12 (representing focus) -->
  <line x1="256" y1="256" x2="256" y2="148" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="256" y1="256" x2="256" y2="132" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
